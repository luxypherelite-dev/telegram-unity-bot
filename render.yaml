services:
  - type: web
    name: telegram-unity-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    disk:
      name: bot-data
      mountPath: /var/data/telegram-unity-bot
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PORT
        value: "10000"
      - key: BOT_DATA_DIR
        value: /var/data/telegram-unity-bot
